name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run format
      - run: npm run lint
      - name: Run tests with coverage
        id: coverage
        run: npm run coverage
        continue-on-error: true
      - name: Comment coverage report on pull requests
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const marker = '<!-- pricefeed-coverage-report -->';
            const thresholds = {
              lines: 72,
              statements: 72,
              functions: 89,
              branches: 90,
            };
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const summaryPath = path.join(workspace, 'coverage', 'coverage-summary.json');

            if (!fs.existsSync(summaryPath)) {
              core.warning(`Coverage summary not found at ${summaryPath}; skipping PR coverage comment.`);
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const total = summary.total;

            function status(pct, threshold) {
              return pct >= threshold ? ':large_green_circle:' : ':red_circle:';
            }

            function percent(value) {
              return `${Number(value || 0).toFixed(2)}%`;
            }

            function metricRow(label, key) {
              const metric = total[key] || { pct: 0, covered: 0, total: 0 };
              return `| ${status(metric.pct, thresholds[key])} | ${label} | ${percent(metric.pct)} | ${thresholds[key]}% | ${metric.covered} / ${metric.total} |`;
            }

            function fileName(file) {
              const relative = path.isAbsolute(file) ? path.relative(workspace, file) : file;
              return relative.replaceAll(path.sep, '/');
            }

            const categories = [
              ['Lines', 'lines'],
              ['Statements', 'statements'],
              ['Functions', 'functions'],
              ['Branches', 'branches'],
            ];

            const fileRows = Object.entries(summary)
              .filter(([file]) => file !== 'total')
              .sort(([left], [right]) => fileName(left).localeCompare(fileName(right)))
              .map(([file, metrics]) => (
                `| \`${fileName(file)}\` | ${percent(metrics.lines?.pct)} | ${percent(metrics.statements?.pct)} | ${percent(metrics.functions?.pct)} | ${percent(metrics.branches?.pct)} |`
              ));

            const serverUrl = process.env.GITHUB_SERVER_URL || 'https://github.com';
            const { owner, repo } = context.repo;
            const runUrl = `${serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commitSha = context.payload.pull_request.head.sha;
            const headRepoUrl = context.payload.pull_request.head.repo.html_url || `${serverUrl}/${owner}/${repo}`;
            const commitUrl = `${headRepoUrl}/commit/${commitSha}`;

            const body = [
              marker,
              '## Coverage Report',
              '',
              '| Status | Category | Percentage | Threshold | Covered / Total |',
              '| --- | --- | ---: | ---: | ---: |',
              ...categories.map(([label, key]) => metricRow(label, key)),
              '',
              '<details>',
              '<summary>File Coverage</summary>',
              '',
              '| File | Lines | Statements | Functions | Branches |',
              '| --- | ---: | ---: | ---: | ---: |',
              ...fileRows,
              '',
              '</details>',
              '',
              `Generated in workflow [#${context.runNumber}](${runUrl}) for commit [${commitSha.slice(0, 7)}](${commitUrl}) by GitHub Actions.`,
            ].join('\n');

            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existingComment = comments.find((comment) => (
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            ));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: node
          fail_ci_if_error: true
      - name: Enforce coverage threshold
        if: steps.coverage.outcome == 'failure'
        run: exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create config from sample
        run: cp config.sample.yaml config.yaml
      - name: Validate docker compose configuration
        run: docker compose config
      - name: Build image with docker compose
        run: docker compose build
      - name: Smoke test the docker compose stack
        run: |
          docker compose run --rm -T pricefeed \
            node -e "const { loadConfig } = require('./src/config-loader'); const c = loadConfig(); if (!Array.isArray(c.rpc_nodes) || c.rpc_nodes.length < 3) { console.error('rpc_nodes missing or too few'); process.exit(1); } console.log('docker compose smoke test OK; account =', c.feed_steem_account);"

  docker_push:
    name: Build and push image to Docker Hub
    needs: [test, docker]
    # Publish :latest only from master (or a manual run). Pull requests are
    # skipped because they cannot access the environment secrets.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push justyy/pricefeed:latest
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: justyy/pricefeed:latest
